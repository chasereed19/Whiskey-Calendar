<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whiskey Advent Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b0b10;
      --card-bg: #181820;
      --accent: #d4a658;
      --accent-soft: rgba(212, 166, 88, 0.25);
      --text: #f5f5f5;
      --muted: #b7b7c0;
      --border-radius: 18px;
      --shadow-soft: 0 14px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #202032 0, #050509 50%, #020206 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .calendar-wrapper {
      max-width: 1100px;
      width: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .calendar-header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      justify-content: space-between;
    }

    .title-block h1 {
      font-size: clamp(1.8rem, 2.4vw, 2.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title-block h1 span {
      color: var(--accent);
    }

    .title-block p {
      margin-top: 4px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .tagline {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      background: radial-gradient(circle at top left, rgba(212,166,88,0.18), transparent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      white-space: nowrap;
    }

    .tagline-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(212,166,88,0.7);
    }

    .calendar-grid {
      padding: 20px 22px 24px;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 900px) {
      .calendar-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .calendar-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 18px;
      }
      .calendar-header {
        padding: 18px;
      }
    }

    .day-card {
      position: relative;
      aspect-ratio: 4 / 5;
      border-radius: var(--border-radius);
      background: radial-gradient(circle at 20% 0, rgba(255,255,255,0.1), transparent 50%),
                  linear-gradient(145deg, #171721, #090910);
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .day-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0, rgba(212,166,88,0.32), transparent 55%);
      mix-blend-mode: soft-light;
      opacity: 0.5;
      pointer-events: none;
    }

    .day-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.65);
      border-color: rgba(212,166,88,0.7);
    }

    .day-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .day-number {
      position: relative;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 14px rgba(0,0,0,0.9);
    }

    .day-number span {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-align: center;
      margin-top: 2px;
    }

    .day-corner-label {
      position: absolute;
      inset: 9px 9px auto auto;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
    }

    .day-ribbon {
      position: absolute;
      inset: auto -38px -38px auto;
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, var(--accent), #f3d29a);
      transform: rotate(35deg);
      opacity: 0.06;
      pointer-events: none;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      max-width: 780px;
      width: 100%;
      background: #0b0b10;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 60px rgba(0,0,0,0.75);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    }

    @media (max-width: 720px) {
      .modal {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .modal-image {
      position: relative;
      background: radial-gradient(circle at top, #292938, #09090f 60%);
      min-height: 260px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 16px 16px 12px;
    }

    .modal-day-pill {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
    }

    .modal-content {
      padding: 18px 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .modal-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 0 0 0;
    }

    .modal-close:hover {
      color: var(--accent);
    }

    .modal-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .modal-notes-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      margin-top: 6px;
    }

    .modal-notes {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }

    .modal-meta {
      margin-top: auto;
      padding-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px dashed rgba(255,255,255,0.15);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>

  <script>
    const modalBackdrop = document.getElementById("whiskeyModal");
    const modalClose = document.getElementById("modalClose");

    const modalImage = document.getElementById("modalImage");
    const modalTitle = document.getElementById("modalTitle");
    const modalSubtitle = document.getElementById("modalSubtitle");
    const modalNotes = document.getElementById("modalNotes");
    const modalDayLabel = document.getElementById("modalDayLabel");
    const modalOrigin = document.getElementById("modalOrigin");
    const modalProof = document.getElementById("modalProof");

    function openModalFromCard(card) {
      const day = card.getAttribute("data-day");
      const name = card.getAttribute("data-name");
      const subtitle = card.getAttribute("data-subtitle");
      const notes = card.getAttribute("data-notes");
      const origin = card.getAttribute("data-origin");
      const proof = card.getAttribute("data-proof");
      const image = card.getAttribute("data-image");

      modalDayLabel.textContent = `Day ${day} • December`;
      modalTitle.textContent = name || `Day ${day} Whiskey`;
      modalSubtitle.textContent = subtitle || "";
      modalNotes.textContent = notes || "";
      modalOrigin.textContent = origin ? `Origin: ${origin}` : "";
      modalProof.textContent = proof ? `Proof: ${proof}` : "";
      modalImage.src = image || "";
      modalImage.alt = name ? `Whiskey for Day ${day}: ${name}` : `Whiskey for Day ${day}`;

      modalBackdrop.classList.add("active");
      modalBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalBackdrop.classList.remove("active");
      modalBackdrop.setAttribute("aria-hidden", "true");
      // optional: clear image src to avoid any flashing
      // modalImage.src = "";
    }

    document.querySelectorAll(".day-card").forEach(card => {
      card.addEventListener("click", () => openModalFromCard(card));
    });

    modalClose.addEventListener("click", closeModal);

    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBackdrop.classList.contains("active")) {
        closeModal();
      }
    });
  </script>
</body>
</html>
